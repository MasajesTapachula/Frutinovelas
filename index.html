<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FrutinovelasMX</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0a0a;color:#fff}.scroll-hide::-webkit-scrollbar{display:none}.light{background:#f5f5f5 !important;color:#111 !important}.light header{background:#fff !important;border-color:#e5e5e5 !important}.light .bg-zinc-900,.light .bg-black{background:#fff !important;border-color:#e5e5e5 !important}.light .bg-zinc-800{background:#e5e5e5 !important}.light .text-white{color:#111 !important}</style></head><body class="transition-colors">
<header class="sticky top-0 z-50 bg-black/95 border-b border-zinc-800"><div class="max-w-7xl mx-auto">
<div class="hidden md:flex justify-between items-center p-4"><h1 class="text-2xl font-bold"><span class="text-pink-500">Fruti</span>novelasMX</h1><div class="flex gap-2"><div class="relative w-[320px]"><input id="searchDesk" placeholder="Buscar..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full pl-10 pr-5 py-2.5 text-[15px]"><span class="absolute left-3 top-3">🔍</span></div><button onclick="toggleTheme()" id="themeBtnDesk" class="w-10 h-10 rounded-full bg-zinc-800 border border-zinc-700">🌙</button><button onclick="showPage('login')" class="bg-zinc-800 px-4 py-2.5 rounded-full text-sm">Iniciar Sesión</button><button onclick="showPage('registro')" class="bg-yellow-400 text-black px-5 py-2.5 rounded-full text-sm font-bold">Premium / Creador</button></div></div>
<div class="md:hidden flex gap-2 overflow-x-auto scroll-hide items-center p-3"><h1 class="font-bold whitespace-nowrap"><span class="text-pink-500">Fruti</span>novelasMX</h1><div class="relative flex-shrink-0 w-[200px]"><input id="searchMob" placeholder="Buscar..." class="w-full bg-zinc-900 border rounded-full pl-9 pr-3 py-3 text-[16px]"><span class="absolute left-3 top-3.5">🔍</span></div><button onclick="toggleTheme()" id="themeBtnMob" class="flex-shrink-0 w-10 h-10 rounded-full bg-zinc-800">🌙</button><button onclick="showPage('login')" class="flex-shrink-0 bg-zinc-800 px-3 py-3 rounded-full text-xs">Login</button><button onclick="showPage('registro')" class="flex-shrink-0 bg-yellow-400 text-black px-3 py-3 rounded-full text-xs font-bold">Hazte Premium / Creador → </button></div>
</div></header>
<div id="page-home" class="max-w-7xl mx-auto"><div class="p-6"><h2 class="text-3xl font-bold">Bienvenidos a FrutinovelasMX</h2><p class="text-sm text-zinc-400 mt-2">Bienvenidos a FrutinovelasMX, el único lugar donde encontraras todas la frutinovelas que quieras, tanto gratis como premium, disfruta de todo nuestro contenido.</p></div><div id="grid" class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4"></div></div>
<script>
let theme=localStorage.getItem('frutiTheme')||'dark';
function applyTheme(){let light=theme==='light';document.body.classList.toggle('light',light);document.getElementById('themeBtnDesk').textContent=light?'☀️':'🌙';document.getElementById('themeBtnMob').textContent=light?'☀️':'🌙'}
function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('frutiTheme',theme);applyTheme()}applyTheme();
const data=[{title:"Fresa Prohibida",thumb:"🍓"},{title:"Mango Venganza",thumb:"🥭"},{title:"Uvas Celosas",thumb:"🍇"}];
function renderGrid(){document.getElementById('grid').innerHTML=data.map(d=>`<div class="bg-zinc-900 rounded-2xl border border-zinc-800 p-3"><div class="text-5xl text-center">${d.thumb}</div><div class="font-bold text-sm mt-2">${d.title}</div></div>`).join('')}renderGrid();
function showPage(p){alert('Ir a '+p)}
</script></body></html>
