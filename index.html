<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FrutinovelasMX</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:sans-serif;background:#0a0a0a}.scroll-hide::-webkit-scrollbar{display:none}.scroll-hide{-ms-overflow-style:none;scrollbar-width:none}</style></head><body class="text-white">
<header class="sticky top-0 z-50 bg-black/95 border-b border-zinc-800">
  <div class="max-w-7xl mx-auto">
    <div class="hidden md:flex justify-between items-center gap-4 p-4">
      <h1 class="text-2xl font-bold"><span class="text-pink-500">Fruti</span>novelasMX</h1>
      <div class="flex items-center gap-3 flex-1 justify-end">
        <div class="relative w-full max-w-[400px]"><input id="searchDesk" placeholder="Buscar frutinovela..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full pl-10 pr-5 py-2.5 text-[15px] outline-none"><span class="absolute left-3 top-3">🔍</span></div>
        <button onclick="showPage('registro')" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-black px-5 py-2.5 rounded-full text-sm font-bold">Hazte Premium / Creador</button>
      </div>
    </div>
    <div class="md:hidden flex gap-3 overflow-x-auto scroll-hide items-center p-3">
      <h1 class="text-xl font-bold whitespace-nowrap"><span class="text-pink-500">Fruti</span>novelasMX</h1>
      <div class="relative flex-shrink-0 w-[260px]"><input id="searchMob" placeholder="Buscar frutinovela..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full pl-10 pr-4 py-3 text-[16px] outline-none"><span class="absolute left-3 top-3.5">🔍</span></div>
      <button onclick="showPage('registro')" class="flex-shrink-0 bg-gradient-to-r from-yellow-400 to-orange-500 text-black px-4 py-3 rounded-full text-xs font-bold">Hazte Premium / Creador →</button>
      <div class="flex-shrink-0 w-1"></div>
    </div>
  </div>
</header>
<div id="page-home" class="max-w-7xl mx-auto">
  <div class="p-6 bg-gradient-to-br from-zinc-900 to-black border-b border-zinc-800"><h2 class="text-3xl font-bold">Bienvenidos a FrutinovelasMX</h2><p class="text-zinc-400 mt-2 text-sm max-w-2xl">El lugar donde podrás disfrutar y/o publicar todas las frutinovelas que quieras. Historias de frutas, drama, amor y venganza. Ve gratis lo que los creadores dejan gratis, o hazte premium por $200/mes y ve todo.</p></div>
  <div class="px-6 py-4"><div class="flex gap-2 overflow-x-auto scroll-hide" id="catBubbles"></div></div>
  <main class="p-4"><div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div></main>
</div>
<script>
const data=[{title:"La Fresa Prohibida T1",cat:"Romance",type:"temporada",season:"La Fresa Prohibida T1",thumb:"🍓",free:true,views:"12k"},{title:"Mango Venganza",cat:"Drama",type:"suelto",thumb:"🥭",free:false,views:"22k"},{title:"Uvas Celosas",cat:"Comedia",type:"suelto",thumb:"🍇",free:true,views:"5k"},{title:"Sandía Secreta",cat:"Drama",type:"suelto",thumb:"🍉",free:false,views:"30k"}];
const cats=["Todas","Romance","Drama","Comedia","Gratis","Premium $200"];
let active="Todas";
function renderCats(){document.getElementById('catBubbles').innerHTML=cats.map(c=>`<button onclick="active='${c}';renderCats();renderGrid()" class="whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold border ${active===c?'bg-white text-black':'bg-zinc-900 text-zinc-400'}">${c}</button>`).join('')}
function renderGrid(){let q=(document.getElementById('searchMob')?.value||document.getElementById('searchDesk')?.value||'').toLowerCase();let list=data.filter(d=>!q||d.title.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(d=>`<div class="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden"><div class="aspect-video bg-black flex items-center justify-center text-5xl">${d.thumb}</div><div class="p-3"><div class="font-bold text-sm">${d.title}</div><div class="text-[11px] text-zinc-500">${d.cat}</div></div></div>`).join('')}
document.getElementById('searchMob').addEventListener('input',renderGrid);document.getElementById('searchDesk').addEventListener('input',renderGrid);renderCats();renderGrid();
function showPage(p){alert('Ir a '+p+' - aquí va el formulario de registro premium/creador')}
</script></body></html>
