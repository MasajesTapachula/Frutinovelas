<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutinovelas - Plataforma</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="left">
    <div class="logo">🍓 FRUTINOVELAS</div>
    <div class="search"><input id="searchInput" placeholder="Buscar fresa, mango, infiel..."><button>🔍</button></div>
  </div>
  <div class="right">
    <button class="ghost" onclick="openModal('creator')">Subir</button>
    <button class="primary" onclick="openModal('register')">Entrar</button>
  </div>
</header>
<div class="categories" id="categories"></div>
<main><div class="feed"><div class="grid" id="grid"></div></div></main>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeModal()">✕</button><div id="modal-content"></div></div></div>
<script src="script.js"></script>
</body>
</html>
