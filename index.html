
<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FrutinovelasMX</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0a0a0a}.scroll-hide::-webkit-scrollbar{display:none}.scroll-hide{-ms-overflow-style:none;scrollbar-width:none}</style></head><body class="text-white">
<header class="sticky top-0 z-50 bg-black/95 border-b border-zinc-800"><div class="max-w-7xl mx-auto"><div class="hidden md:flex justify-between items-center p-4"><h1 class="text-2xl font-bold"><span class="text-pink-500">Fruti</span>novelasMX</h1><div class="flex gap-2"><div class="relative w-[360px]"><input id="searchDesk" placeholder="Buscar..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full pl-10 pr-5 py-2.5 text-[15px]"><span class="absolute left-3 top-3">🔍</span></div><button onclick="showPage('login')" class="bg-zinc-800 border border-zinc-700 px-4 py-2.5 rounded-full text-sm font-bold">Iniciar Sesión</button><button onclick="showPage('registro')" class="bg-yellow-400 text-black px-5 py-2.5 rounded-full text-sm font-bold">Hazte Premium / Creador</button></div></div><div class="md:hidden flex gap-2 overflow-x-auto scroll-hide items-center p-3"><h1 class="text-[19px] font-bold whitespace-nowrap"><span class="text-pink-500">Fruti</span>novelasMX</h1><div class="relative flex-shrink-0 w-[220px]"><input id="searchMob" placeholder="Buscar..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full pl-9 pr-3 py-3 text-[16px]"><span class="absolute left-3 top-3.5">🔍</span></div><button onclick="showPage('login')" class="flex-shrink-0 bg-zinc-800 border border-zinc-700 px-4 py-3 rounded-full text-xs font-bold">Iniciar Sesión</button><button onclick="showPage('registro')" class="flex-shrink-0 bg-yellow-400 text-black px-4 py-3 rounded-full text-xs font-bold">Premium / Creador →</button></div></div></header>
<div id="page-home" class="max-w-7xl mx-auto"><div class="p-6 bg-gradient-to-br from-zinc-900 to-black"><h2 class="text-3xl font-bold">Bienvenidos a FrutinovelasMX</h2><p class="text-zinc-400 mt-2 text-sm">Disfruta y/o publica todas las frutinovelas que quieras. $200/mes ve todo.</p></div><div class="px-6 py-4"><div class="flex gap-2 overflow-x-auto scroll-hide" id="catBubbles"></div></div><main class="p-4"><div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div></main></div>
<div id="page-registro" class="hidden max-w-3xl mx-auto p-6"><button onclick="showPage('home')" class="bg-zinc-800 px-3 py-1 rounded-full text-sm mb-6">← Volver</button><div class="bg-zinc-900 rounded-2xl border border-zinc-800 p-6"><h2 class="text-2xl font-bold">Hazte parte de FrutinovelasMX - Elige 1 de 3</h2><div class="grid md:grid-cols-3 gap-3 mt-6"><button onclick="selectRole('cliente')" id="role-cliente" class="border-2 border-zinc-700 rounded-xl p-4 text-left"><div>🍿</div><div class="font-bold text-sm mt-2">1. Solo Ve Premium - CLIENTE $200</div><div class="text-[11px] text-zinc-400">Ve todo premium</div></button><button onclick="selectRole('creador')" id="role-creador" class="border-2 border-zinc-700 rounded-xl p-4 text-left"><div>🎬</div><div class="font-bold text-sm mt-2">2. Solo Hace Contenido - CREADOR</div><div class="text-[11px] text-zinc-400">Publica, 3 gratis o 1 temp gratis</div></button><button onclick="selectRole('ambos')" id="role-ambos" class="border-2 border-yellow-500 bg-yellow-500/10 rounded-xl p-4 text-left"><div>⭐</div><div class="font-bold text-sm mt-2">3. Hace y Ve Premium - AMBOS $200</div><div class="text-[11px] text-zinc-300">Todo acceso</div></button></div><div class="mt-6 space-y-3"><input placeholder="Nombre" class="w-full bg-black border border-zinc-800 rounded-lg px-4 py-3 text-sm"><input placeholder="Correo" class="w-full bg-black border border-zinc-800 rounded-lg px-4 py-3 text-sm"><button class="w-full bg-pink-600 py-3 rounded-xl font-bold">Crear cuenta</button><div class="text-center text-xs">¿Ya tienes? <button onclick="showPage('login')" class="text-pink-400 underline">Inicia Sesión</button></div></div></div></div>
<div id="page-login" class="hidden max-w-md mx-auto p-6"><button onclick="showPage('home')" class="bg-zinc-800 px-3 py-1 rounded-full text-sm mb-6">← Volver</button><div class="bg-zinc-900 rounded-2xl border border-zinc-800 p-6"><h2 class="text-2xl font-bold">Iniciar Sesión</h2><p class="text-zinc-400 text-sm">Entra a tus privilegios</p><div class="mt-6 space-y-3"><input placeholder="Correo" class="w-full bg-black border border-zinc-800 rounded-lg px-4 py-3 text-sm"><input placeholder="Contraseña" type="password" class="w-full bg-black border border-zinc-800 rounded-lg px-4 py-3 text-sm"><button class="w-full bg-white text-black py-3 rounded-xl font-bold">Entrar</button><div class="text-center text-xs mt-2">¿No tienes? <button onclick="showPage('registro')" class="text-yellow-400 underline">Hazte Premium / Creador</button></div></div></div></div>
<div id="page-temporada" class="hidden max-w-7xl mx-auto"><div class="p-6"><button onclick="showPage('home')" class="bg-zinc-800 px-3 py-1 rounded-full text-sm">← Volver</button><h2 id="tempTitle" class="text-2xl font-bold mt-2"></h2></div><div id="tempGrid" class="p-6 grid grid-cols-2 md:grid-cols-4 gap-4"></div></div>
<script>
const data=[{title:"La Fresa Prohibida T1",season:"La Fresa Prohibida T1",thumb:"🍓",cat:"Romance",type:"temporada"},{title:"Mango Venganza",thumb:"🥭",cat:"Drama",type:"suelto"},{title:"Uvas Celosas",thumb:"🍇",cat:"Comedia",type:"suelto"},{title:"Sandía Secreta",thumb:"🍉",cat:"Drama",type:"suelto"}];
const cats=["Todas","Romance","Drama","Comedia","Gratis","Premium $200"];
let active="Todas";
function renderCats(){document.getElementById('catBubbles').innerHTML=cats.map(c=>`<button onclick="active='${c}';renderCats();renderGrid()" class="whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold border ${active===c?'bg-white text-black':'bg-zinc-900 text-zinc-400'}">${c}</button>`).join('')}
function renderGrid(){let q=(document.getElementById('searchMob')?.value||document.getElementById('searchDesk')?.value||'').toLowerCase();let list=data.filter(d=>!q||d.title.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(d=>`<div class="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden"><div class="aspect-video bg-black flex items-center justify-center text-5xl">${d.thumb}</div><div class="p-3"><div class="font-bold text-sm">${d.title}</div></div></div>`).join('')}
function showPage(p){['home','registro','login','temporada'].forEach(x=>document.getElementById('page-'+x)?.classList.add('hidden'));document.getElementById('page-'+p).classList.remove('hidden')}
function selectRole(r){document.querySelectorAll('[id^=role-]').forEach(c=>c.classList.remove('border-pink-600'));document.getElementById('role-'+r).classList.add('border-pink-600')}
document.getElementById('searchMob')?.addEventListener('input',renderGrid);document.getElementById('searchDesk')?.addEventListener('input',renderGrid);renderCats();renderGrid();
</script></body></html>
