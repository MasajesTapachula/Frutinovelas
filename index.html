<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutinovelas V3 - $200 Modelo XVideos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif}</style>
</head>
<body class="bg-[#0a0a0a] text-white">
<header class="border-b border-zinc-800 p-4 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur z-50">
  <h1 class="text-2xl font-bold"><span class="text-pink-500">Fruti</span>Novelas <span class="text-xs bg-zinc-800 px-2 py-1 rounded-full ml-2">V3 $200</span></h1>
  <button id="btnPremium" class="px-5 py-2 bg-gradient-to-r from-yellow-400 to-orange-500 text-black rounded-full text-sm font-bold">Hazte Premium $200/mes</button>
</header>
<div class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="lg:col-span-1 bg-zinc-900 rounded-2xl p-5 border border-zinc-800 h-fit">
  <h2 class="font-bold text-lg">📁 Panel Creador</h2>
  <p class="text-[11px] text-zinc-400 mt-1">Libertad total, pero mínimo: 3 gratis o 1 temporada gratis.</p>
  <div class="mt-4 p-3 rounded-xl bg-zinc-800/50 border border-dashed border-zinc-700">
    <input id="inputFolder" placeholder="Nombre temporada Ej: Temp 1" class="w-full bg-zinc-900 rounded-lg px-3 py-2 text-sm outline-none">
    <button id="createFolder" class="w-full bg-pink-600 mt-2 py-2 rounded-lg text-sm font-bold">Crear Temporada / Carpeta</button>
  </div>
  <div class="mt-4">
    <select id="selectFolder" class="w-full bg-zinc-800 rounded-lg px-3 py-2 text-sm"></select>
    <input id="inputVideo" placeholder="Capítulo Ej: Cap 4 - Venganza" class="w-full bg-zinc-800 rounded-lg px-3 py-2 text-sm mt-2">
    <button id="addVideo" class="w-full bg-zinc-700 hover:bg-zinc-600 mt-2 py-2 rounded-lg text-sm">+ Añadir Video (empieza como Gratis)</button>
  </div>
  <div class="mt-5 p-3 rounded-xl bg-black border border-zinc-800">
    <div class="text-xs font-bold">Validación para publicar:</div>
    <div id="validation" class="text-[11px] mt-2 space-y-1"></div>
    <button id="btnPublish" class="w-full mt-3 py-2 rounded-lg text-sm font-bold bg-zinc-800 text-zinc-500">Publicar Perfil</button>
  </div>
  <div id="creatorList" class="mt-5 space-y-4"></div>
</div>
<div class="lg:col-span-2">
  <div class="mb-6 bg-gradient-to-br from-zinc-900 to-black rounded-2xl border border-zinc-800 p-6">
    <h2 class="text-2xl font-bold">Ver sin cuenta - Estilo XVideos</h2>
    <p class="text-zinc-400 text-sm mt-1">El creador decide que es gratis. Tú ves gratis sin registro. Para lo premium: $200/mes todo ilimitado.</p>
  </div>
  <div id="clientList" class="space-y-6"></div>
</div>
</div>
<script>
let folders = {
  "Temporada 1 - La Fresa": [{title:"Cap 1 - Piloto", free:true},{title:"Cap 2 - El mensaje", free:true},{title:"Cap 3 - Cita secreta", free:true}],
  "Temporada 2 - Venganza": [{title:"Cap 4 - Traicion", free:false},{title:"Cap 5 - Final explosivo", free:false}]
};
let isPremium = false;
function render(){
  const sel = document.getElementById('selectFolder');
  sel.innerHTML = Object.keys(folders).map(f=>`<option>${f}</option>`).join('');
  let totalFree = 0; let hasFullFreeSeason = false;
  Object.values(folders).forEach(vids=>{
    totalFree += vids.filter(v=>v.free).length;
    if(vids.length>0 && vids.every(v=>v.free)) hasFullFreeSeason = true;
  });
  const valid = totalFree >=3 || hasFullFreeSeason;
  const vDiv = document.getElementById('validation');
  vDiv.innerHTML = `
    <div class="${totalFree>=3 ? 'text-green-400':'text-red-400'}">● ${totalFree} videos gratis (mínimo 3) ${totalFree>=3?'✓':'✗'}</div>
    <div class="${hasFullFreeSeason ? 'text-green-400':'text-zinc-500'}">● 1 temporada completa gratis ${hasFullFreeSeason?'✓':'○'}</div>
    <div class="mt-1 text-zinc-300">Estado: ${valid? '<b class="text-green-400">APTO PARA PUBLICAR ✓</b>' : '<b class="text-red-400">FALTA CONTENIDO GRATIS</b>'}</div>
  `;
  const btnPub = document.getElementById('btnPublish');
  btnPub.className = valid ? 'w-full mt-3 py-2 rounded-lg text-sm font-bold bg-green-500 text-black' : 'w-full mt-3 py-2 rounded-lg text-sm font-bold bg-zinc-800 text-zinc-500';
  btnPub.innerText = valid ? '✅ Publicar Perfil - Listo' : '🔒 Falta contenido gratis';
  const cList = document.getElementById('creatorList'); cList.innerHTML='';
  Object.entries(folders).forEach(([name, vids])=>{
    let h = `<div class="bg-zinc-800/50 rounded-xl p-3"><div class="flex justify-between"><b class="text-sm">📁 ${name}</b><span class="text-[10px] ${vids.every(v=>v.free)?'bg-green-600 text-white':'bg-zinc-700'} px-2 py-0.5 rounded-full">${vids.every(v=>v.free)?'TEMPORADA GRATIS': vids.length+' caps'}</span></div><div class="mt-2 space-y-1">`;
    vids.forEach((v,i)=>{
      h+=`<div class="flex items-center gap-2 bg-zinc-900 p-2 rounded-lg text-xs"><span class="flex-1 truncate">${i+1}. ${v.title}</span><button onclick="toggleFree('${name}',${i})" class="px-2 py-1 rounded-full text-[10px] font-bold ${v.free?'bg-green-600':'bg-yellow-500 text-black'}">${v.free?'GRATIS':'PREMIUM'}</button><button onclick="delVideo('${name}',${i})" class="text-zinc-600">✕</button></div>`;
    });
    h+='</div></div>'; cList.innerHTML+=h;
  });
  const cl = document.getElementById('clientList'); cl.innerHTML='';
  Object.entries(folders).forEach(([name, vids])=>{
    const freeCount = vids.filter(v=>v.free).length;
    let h=`<div class="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden"><div class="p-4 flex justify-between items-center bg-zinc-800/30"><h3 class="font-bold">📁 ${name}</h3><span class="text-xs ${freeCount===vids.length?'text-green-400':'text-zinc-400'}">${freeCount} gratis / ${vids.length} total ${freeCount===vids.length?'(Temporada gratis)':''}</span></div><div class="divide-y divide-zinc-800">`;
    vids.forEach((v,i)=>{
      const can = v.free || isPremium;
      h+=`<div class="p-4 flex justify-between items-center hover:bg-zinc-800/50"><div><div class="text-sm font-medium">${i+1}. ${v.title} ${v.free?'🟢':'🔒'}</div><div class="text-[11px] text-zinc-500">${v.free? 'Gratis - sin cuenta' : (isPremium? 'Premium - incluido en tus $200':'Premium - $200/mes') }</div></div><button onclick="play('${v.title}',${can})" class="px-4 py-1.5 rounded-full text-xs font-bold ${can?'bg-white text-black':'bg-yellow-500 text-black'}">${can?'▶️ Ver':'🔒 $200'}</button></div>`;
    });
    h+='</div></div>'; cl.innerHTML+=h;
  });
}
window.toggleFree = (folder,i)=>{ folders[folder][i].free = !folders[folder][i].free; render(); }
window.delVideo = (folder,i)=>{ folders[folder].splice(i,1); if(folders[folder].length===0) delete folders[folder]; render(); }
window.play = (title, can)=>{ if(!can){ document.getElementById('btnPremium').classList.add('animate-bounce'); setTimeout(()=>document.getElementById('btnPremium').classList.remove('animate-bounce'),1000); return; } alert('▶️ '+title); }
document.getElementById('createFolder').onclick=()=>{ const n=document.getElementById('inputFolder').value.trim(); if(!n) return; folders[n]=[]; document.getElementById('inputFolder').value=''; render(); }
document.getElementById('addVideo').onclick=()=>{ const f=document.getElementById('selectFolder').value; const t=document.getElementById('inputVideo').value.trim(); if(!f || !t) return alert('Selecciona carpeta y pon titulo'); folders[f].push({title:t, free:true}); document.getElementById('inputVideo').value=''; render(); }
document.getElementById('btnPublish').onclick=()=>{ let totalFree=0, hasFull=false; Object.values(folders).forEach(v=>{ totalFree+=v.filter(x=>x.free).length; if(v.length>0 && v.every(x=>x.free)) hasFull=true; }); if(totalFree>=3 || hasFull) alert('✅ Perfil publicado.'); else alert('❌ Te faltan gratis.'); }
document.getElementById('btnPremium').onclick=()=>{ isPremium=!isPremium; const b=document.getElementById('btnPremium'); b.innerText=isPremium?'✅ Premium Activo $200':'Hazte Premium $200/mes'; b.className=isPremium?'px-5 py-2 bg-green-500 text-black rounded-full text-sm font-bold':'px-5 py-2 bg-gradient-to-r from-yellow-400 to-orange-500 text-black rounded-full text-sm font-bold'; render(); }
render();
</script>
</body>
</html>
